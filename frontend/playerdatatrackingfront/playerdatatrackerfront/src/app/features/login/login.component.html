<div class="login-page">
  <div class="login-card">
    <h1 class="login-title">Iniciar sesión</h1>

    <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
      <div class="form-group">
        <label for="username">Usuario</label>
        <input
          id="username"
          type="text"
          formControlName="username"
          class="input"
          autocomplete="username"
          [class.invalid]="form.controls['username'].invalid && form.controls['username'].touched"
        />
        <small class="error" *ngIf="form.controls['username'].invalid && form.controls['username'].touched">
          El usuario es obligatorio.
        </small>
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input
          id="password"
          type="password"
          formControlName="password"
          class="input"
          autocomplete="current-password"
          [class.invalid]="form.controls['password'].invalid && form.controls['password'].touched"
        />
        <small class="error" *ngIf="form.controls['password'].invalid && form.controls['password'].touched">
          La contraseña es obligatoria.
        </small>
      </div>

      <button class="btn-primary full" [disabled]="loading || form.invalid" type="submit">
        {{ loading ? 'Entrando…' : 'Entrar' }}
      </button>
      <button type="button" class="btn-secondary full" (click)="register()"> Registrarse </button>

      <p *ngIf="error" class="alert-error">{{ error }}</p>
    </form>
  </div>
</div>
