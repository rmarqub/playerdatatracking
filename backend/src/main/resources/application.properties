spring.application.name=playerdatatracking

# Configuracion PostgreSQL
spring.datasource.url=jdbc:postgresql://localhost:5432/playerdata
spring.datasource.username=postgres
spring.datasource.password=admin
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.show-sql=true
spring.jpa.hibernate.ddl-auto=update

#XSLImpostPath
xsl.path = classpath:xsl/Scouting.xlsx

#ApiKey
apikeys.secret = dUq1uvQIAl8eevnjToANcMGfrRbyW65mfaAOa2AwSMU=

logging.level.org.hibernate.SQL=ERROR
logging.level.org.hibernate.type.descriptor.sql.BasicBinder=ERROR


# Tiempo de inactividad para expirar sesión (ej. 30 min)
server.servlet.session.timeout=30m

# Cookie de sesión
server.servlet.session.cookie.name=JSESSIONID
server.servlet.session.cookie.http-only=true
# En desarrollo local sin HTTPS puedes dejar secure=false; en prod ponlo en true
server.servlet.session.cookie.secure=false
server.servlet.session.cookie.same-site=LAX

spring.session.store-type=redis
spring.data.redis.host=localhost
spring.data.redis.port=6379
